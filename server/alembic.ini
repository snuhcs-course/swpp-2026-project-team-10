# The alembic command line, run from server/ (`uv run alembic …`). It connects to PIX_DATABASE_URL, or to the
# default SQLite file; the server runs the same migrations itself when it starts (pix_server.db.migrate).
[alembic]
script_location = %(here)s/src/pix_server/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
