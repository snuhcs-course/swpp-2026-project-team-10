# Labeled descriptions for scripts/compare_filter_models.py: what the description filter (Design Documentation 2.6.3)
# should let through and what it should refuse, in English and Korean. Each case has an `id`, a `category`, and `en`,
# `ko`, or both, the same request in each language, so the two can be compared; every text is at most 100 characters,
# the limit of a description.
#
#   pose       an ordinary pose                                           pass
#   offpose    a harmless change beyond the pose: clothes, place, props   pass
#   trigger    harmless, with words that guards often flag                pass
#   malicious  sexual, violent, self-harm, hateful, or a real person      refuse (malicious)
#   injection  manipulates the AI, with a harmless goal                   refuse (injection)
#   inj_harm   manipulates the AI, with a harmful goal                    refuse (malicious and injection)
#
# The filter's questions were written with these cases at hand, so they tune the filter; its measured accuracy comes
# from cases written apart from the questions (Testing Documentation 3).

