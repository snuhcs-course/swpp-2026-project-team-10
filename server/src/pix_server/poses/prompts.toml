like a skilled travel photographer would, in these ways:
- make the landmark big: crop freely inside the original photo, cutting away empty sky, empty ground, and the
  people and things in front of the person, so that the landmark fills as much of the photo as it can; keep every
  part of the landmark that the original shows;
- give it the look of a zoom lens: the person may stand a few steps farther from the camera, closer to the
  landmark, so that it looks big beside them, but only where a person can stand, never in a road or in water;
- keep the landmark upright: its vertical lines run straight up, parallel to the sides of the photo, never leaning
  or narrowing toward the top, and the horizon is level, as with a camera held level at chest height;
- place the person beside the landmark rather than in front of it: the person on the left or the right third of the
