# AI-generated with Claude Code, 2026-10-29, reviewed by Sungmin Jo
# Reverse proxy in front of the two copies of the app (Design 2.8, Hosting). Its only client is the course's
# HTTP proxy, which is why there is no TLS here.

user nginx;
# The servers report 38 CPUs for the 8 cores we get, so "auto" would start 38 workers.
worker_processes 2;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # The combined format without the query string, so a query parameter never puts personal data in the log (NFR-13).
    # The error log prints a failed request's whole request line and cannot leave it out, so no endpoint takes a Pix
    # ID in its URL: the lookup is POST /api/v1/users/lookup.
    log_format pix '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout pix;
    server_tokens off;

    # Docker's DNS, asked at request time, so nginx starts and reloads while one copy of the app is stopped.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # The course's proxy adds the phone's address as the last X-Forwarded-For value and passes on whatever the
    # client sent before it. Take the last value only (real_ip_recursive stays off) and only from private
    # addresses: the proxy connects from the server's gateway, 10.226.0.1 on Server B.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Sets $pix_app and $pix_copy to the copy that serves. deploy.sh writes this file and reloads nginx.
        include /etc/nginx/pix/active.conf;
        add_header X-Pix-Copy $pix_copy always;

        # A request is at most 1 MiB, the app's own limit. The buffer has the same size, so a scene photo stays
        # in memory, and a pose answer is never written to a temporary file either (FR-4.9, NFR-13).
        client_max_body_size 1m;
        client_body_buffer_size 1m;
        proxy_max_temp_file_size 0;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        # A pose takes up to 60 s, and Uvicorn pings every WebSocket every 20 s.
        proxy_read_timeout 75s;
        # Replace, never append: the app trusts this header as the phone's address for the rate limit.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            proxy_pass http://$pix_app;
        }

        location /api/v1/ {
            proxy_pass http://$pix_app;
        }

        # The page an invite link opens (Design 2.6.6).
        location /i/ {
            proxy_pass http://$pix_app;
        }

        location = /ws {
            proxy_pass http://$pix_app;
            # A location with its own proxy_set_header inherits none, so the three above are repeated.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # The commit that is live, written by deploy.sh; the server-deploy workflow waits for it.
        location = /version {
            default_type text/plain;
            alias /etc/nginx/pix/version;
        }

        # Everything else stays private: FastAPI's /docs and /openapi.json, and the app's /internal routes.
        location / {
            return 404;
        }
    }
}
