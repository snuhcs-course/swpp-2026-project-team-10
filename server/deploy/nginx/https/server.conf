# Included in nginx.conf's server block on an AWS server only: docker-compose.https.yml mounts this folder and
# /etc/letsencrypt, where certbot keeps the certificate under the name pix (server/README.md, HTTPS). The same
# routes then answer on port 443, and X-Forwarded-Proto tells the app the request came over HTTPS, so the invite
# links it writes start with https://.

listen 443 ssl;

ssl_certificate /etc/letsencrypt/live/pix/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/pix/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:pix_tls:10m;
ssl_session_timeout 1d;
