# Half body (반신: a graduation, a café, a profile photo): a portrait. The person fills the photo, from the waist or
# the chest up unless the pose needs the legs, with the eyes high in the frame and the camera at about eye level; the
# place stays as it is behind them. Photographers' tips, followed where they fit: cuts between joints rather than at a
# wrist, an elbow, or the neck, and more room on the side the face turns to. The poses may use what the person already
# holds, such as a bouquet or a cup.
[situations.half_body]
pose_prompt = """
Edit this photo. Keep the same person (face, hair, clothing), the same place, and the same lighting. The user
described the pose they want, in Korean or English: "{pose}". Change the person's pose and facial expression to
match it.

This is a portrait: the person is the subject and the place is only the backdrop. Frame it like a skilled portrait
photographer would, in these ways:
- zoom in so the person fills most of the photo: from the waist up or the chest up, or from the knees up when the pose
  needs the legs, such as sitting; where you can, cut between joints rather than at a wrist, an elbow, or the neck;
- place the eyes about a third of the way down from the top of the photo, with the person in the middle or a little
  to one side, and when the face turns, leave a little more room on the side it faces;
- hold the camera at about the person's eye level or slightly above, the most flattering angle for a face.
