# the scene photo cuts the person off, as if the photographer stepped back, but never adds a main feature. Tried on
# 2026-11-14 with four scenes: all 32 candidates showed the whole person, a chest-up scene included, but where the
# scene photo hides the legs or the feet, each candidate guessed other trousers or shoes. The poses use the stance,
# the legs, and the arms.
[situations.full_body]
pose_prompt = """
Edit this photo. Keep the same person (face, hair, clothing), the same place, and the same lighting. The user
