# AI-generated with Claude Code, 2026-11-26, reviewed by Jaewan Park
name: server-deploy

# GitHub cannot push to the course servers, so each server pulls its branch and deploys it by itself.
# This workflow only watches: it waits until the server reports the commit at /version,
# so a deploy that failed or never ran shows on the commit. Run by hand on main or dev, it watches that branch's
# newest commit, for one pushed while the workflow was off.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  # A newer push replaces the commit the server is deploying, so the older wait would never end.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait:
    name: server-deploy
    # Only main and dev have a server; any other branch's commit would never show.
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    # A deploy builds the image and may wait up to 10 minutes for open rooms before it switches.
    timeout-minutes: 30
    env:
      # Server A runs main, Server B runs dev, each behind the course's HTTPS proxy (Design 2.8, Hosting).
      SERVER_URL: ${{ github.ref_name == 'main' && 'https://team10.swpp-2026-a.snu.ac.kr' || 'https://team10.swpp-2026-b.snu.ac.kr' }}
    steps:
      - name: Wait until the server reports this commit
        run: |
          deadline=$((SECONDS + 1500))
          live=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            live=$(curl -fsS -m 10 "$SERVER_URL/version" 2> /dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "$SERVER_URL is on $GITHUB_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$SERVER_URL reports '${live:-nothing}' and not $GITHUB_SHA. On the server: sudo /opt/pix/repo/server/deploy/deploy.sh status; journalctl -u pix-deploy"
          exit 1
