# AI-generated with Claude Code, 2026-10-14, reviewed by Jaewan Park
name: server-test

on:
  # Required checks must be reported even for PRs that only change Android or docs.
  pull_request:
  push:
    branches: [dev, main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: server-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The same image as server/deploy/docker-compose.yml.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.21"
          working-directory: server
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --dev

      # The session store is an in-process Redis here, which is also what the image build's test stage uses.
      - name: Run pytest
        run: uv run --locked pytest

      # The same tests again on a real Redis, which is what runs the store's Lua scripts on the servers.
      - name: Run pytest against Redis
        run: uv run --locked pytest
        env:
          PIX_TEST_REDIS_URL: redis://localhost:6379/0
