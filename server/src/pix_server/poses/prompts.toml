# Landmark (랜드마크: a famous building, tower, bridge, or statue): the person and the landmark together, as people
# photograph a visit. The app asks for a scene photo that holds the landmark, or the part of it the user wants
# (FR-4.8), so the prompt crops freely inside it to make the landmark big, keeps every part of the landmark that the
# photo shows, upright and never hidden, and frames the person as photographers do: on a third, facing the landmark,
# with nothing rising out of their head, and no cut at a joint. Kept to the scene photo's framing, the landmark stayed
# small: on an Eiffel Tower photo, centered at 45 % of the height behind a full-body person (2026-11-13). Passers-by in
# front may go: told to keep every person in the frame, the model hardly cropped (the tower at 50 % of the height),
# and told to cut them away, it cleared the crowd and showed the tower at 62 % (2026-11-14). Never wider than the scene
# photo: allowed a wider shot, the model drew the bridge's arch into a skyline view and cleared fog, 3 of 24 candidates
# breaking the same background rule, against none without (2026-11-13). Told only to move the person toward the
# landmark, it put them in a road; told to keep sky above the top, it cut the top of an arch that filled the photo
# (2026-11-14). The upright rule holds a straight photo straight but does not correct one taken tilted up. In a photo
# without a landmark, the most notable feature already there takes its place: told only that, the model drew a clock
# tower into a graduation photo (2026-11-13). The poses point at, look at, or play with the landmark.
[situations.landmark]
pose_prompt = """
Edit this photo. Keep the same person (face, hair, clothing), the same place, and the same lighting. The user
described the pose they want, in Korean or English: "{pose}". Change the person's pose and facial expression to
match it.

This photo is at a landmark: the most famous or striking building, tower, bridge, statue, or monument in it. It was
taken to show the landmark, or the part of it that the person wants in their photo. If it shows none, the most
notable feature already in the photo takes its place: never add one, and never make a building taller or closer to
