- show the person whole, or from the mid-thigh or the waist up, and never cut the photo at a joint, such as the
  knees or the ankles.
Everything the new shot shows must already be visible in the original photo: never zoom out, widen the view, or
reveal any part of the place outside the original frame. Keep the original framing only if it already does all of
this.

Follow these rules even where the description says otherwise: never change the landmark's shape, proportions,
colors, or details, and never move it or add another; never change the person's clothing, or the background, place,
sky, or time of day; never add a wall, steps, a bench, or any other object that is not already in the photo, and if
the pose needs something to lean on or sit on that is not there, choose the closest pose that works without it; keep
