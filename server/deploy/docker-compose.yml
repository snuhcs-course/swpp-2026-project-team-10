# AI-generated with Claude Code, 2026-10-21, reviewed by Jaewan Park
# The Pix server on the course server. deploy.sh drives this file and supplies the variables
# On the server, use deploy.sh instead of calling docker compose by hand.
name: pix

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Two copies of the app. One serves; the other is stopped, or is starting during a deploy.
x-app: &app
  env_file: ${PIX_ENV_FILE:-/opt/pix/.env}
  environment:
    # Set here and not in .env, because this file is what names the services. deploy.sh supplies the secrets.
    PIX_REDIS_URL: redis://redis:6379/0
    PIX_DATABASE_URL: postgresql+asyncpg://pix:${PIX_DB_PASSWORD:?deploy.sh sets PIX_DB_PASSWORD}@postgres:5432/pix
    # Signs access tokens; both copies need the same one.
    PIX_JWT_SECRET: ${PIX_JWT_SECRET:?deploy.sh sets PIX_JWT_SECRET}
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped
  # Longer than Uvicorn's 65 s graceful shutdown, so a pose request in flight finishes.
  stop_grace_period: 70s
  logging: *logging

services:
  app-blue:
    <<: *app
    image: pix-server:${PIX_BLUE_TAG:-none}

  app-green:
    <<: *app
    image: pix-server:${PIX_GREEN_TAG:-none}

  # The session store (Design 2.7): rooms, codes, and the rate limit, shared by both copies and all their
  # workers. Its port is not published, so only the app containers reach it. Nothing in it has to survive a
  # restart, so it writes nothing to disk. A deploy starts it once and leaves it running.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped
    logging: *logging

  # The account database (Design 2.7): users, sessions, devices, and friends, shared by both copies. Its port is
  # not published, so only the app containers reach it. Its files are in a directory of the server's own disk,
  # /opt/pix/postgres, not in a Docker volume, so they outlive crashes, restarts, deploys, and reboots, and no Docker
  # cleanup (`down -v`, a volume prune) can delete them. Every worker brings the schema up to date when it starts.
  # A deploy starts it once and leaves it running.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pix
      POSTGRES_DB: pix
      # Taken only when the volume is first created, so the password file deploy.sh keeps must not change.
      POSTGRES_PASSWORD: ${PIX_DB_PASSWORD:?deploy.sh sets PIX_DB_PASSWORD}
    volumes:
      - ${PIX_POSTGRES_DIR:-/opt/pix/postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pix", "-d", "pix"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.30-alpine
    command: ["nginx", "-c", "/etc/nginx/conf/nginx.conf", "-g", "daemon off;"]
    ports:
      # The course's proxy reaches only port 80, and only on 0.0.0.0.
      - "${PIX_HTTP_PORT:-80}:80"
    volumes:
      # Directories, not single files: a bind-mounted file keeps its old content after git or deploy.sh replaces it.
      - ./nginx:/etc/nginx/conf:ro
      - ${PIX_STATE_DIR:-/opt/pix/state}:/etc/nginx/pix:ro
    restart: unless-stopped
    logging: *logging
