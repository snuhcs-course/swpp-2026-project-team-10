# AI-generated with Claude Code, 2026-10-14, reviewed by Jaewan Park
# The Pix server on the course server. deploy.sh drives this file and supplies the variables
# On the server, use deploy.sh instead of calling docker compose by hand.
name: pix

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Two copies of the app. One serves; the other is stopped, or is starting during a deploy.
x-app: &app
  env_file: ${PIX_ENV_FILE:-/opt/pix/.env}
  environment:
    # Set here and not in .env, because this file is what names the service.
    PIX_REDIS_URL: redis://redis:6379/0
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped
  # Longer than Uvicorn's 35 s graceful shutdown, so a pose request in flight finishes.
  stop_grace_period: 40s
  logging: *logging

services:
  app-blue:
    <<: *app
    image: pix-server:${PIX_BLUE_TAG:-none}

  app-green:
    <<: *app
    image: pix-server:${PIX_GREEN_TAG:-none}

  # The session store (Design 2.7): rooms, codes, and the rate limit, shared by both copies and all their
  # workers. Its port is not published, so only the app containers reach it. Nothing in it has to survive a
  # restart, so it writes nothing to disk. A deploy starts it once and leaves it running.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.30-alpine
    command: ["nginx", "-c", "/etc/nginx/conf/nginx.conf", "-g", "daemon off;"]
    ports:
      # The course's proxy reaches only port 80, and only on 0.0.0.0.
      - "${PIX_HTTP_PORT:-80}:80"
    volumes:
      # Directories, not single files: a bind-mounted file keeps its old content after git or deploy.sh replaces it.
      - ./nginx:/etc/nginx/conf:ro
      - ${PIX_STATE_DIR:-/opt/pix/state}:/etc/nginx/pix:ro
    restart: unless-stopped
    logging: *logging
