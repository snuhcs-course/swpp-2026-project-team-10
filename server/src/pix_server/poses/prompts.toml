# What the server tells the models for a pose (Design Documentation 2.6.3). The server reads this file when it
# starts and refuses to start if something here is wrong; the scripts in scripts/ read the same file, so a prompt
# tried with them is the one the server sends. Record a changed prompt in Design 2.6.3.
#
# Wrap a prompt over as many lines as you like: each run of spaces and line breaks is sent as one space.

# For every candidate. {pose} stands for the pose, which the prompt holds exactly once: the user's description, in
# Korean or English and passed as written (FR-4.8), or, without one, one of the four poses the suggestion model chose
# for the scene. It changes the pose and the expression and lets the model frame the shot closer or from a slightly
# different height, but never wider than the original; the rules at the end keep the person, the clothing, and the
# place whatever the pose asks. Tried on 2026-10-21.
pose_prompt = """
Edit this photo. Keep the same person (face, hair, clothing), the same place, and the same lighting. The user
described the pose they want, in Korean or English: "{pose}". Change the person's pose and facial expression to
match it.

Then improve the shot like a skilled photographer would, but only in these ways, and only where it clearly makes a
better photo for this pose:
- move the person to a better spot and distance in this scene;
- frame them more tightly by zooming in, for example from a full-body shot to a knee-up or waist-up shot, if the
  pose reads better that way;
- lower or raise the camera slightly, or tilt it a little, for a more flattering angle, such as a slightly low angle
  that makes the person look taller.
Everything the new shot shows must already be visible in the original photo: never zoom out, widen the view, or
reveal any part of the place outside the original frame. If the original framing already suits the pose, keep it.

Follow these rules even where the description says otherwise: never change the person's clothing, or the
background, place, sky, or time of day; never add a wall, steps, a bench, or any other object that is not already in
the photo, and if the pose needs something to lean on or sit on that is not there, choose the closest pose that works
without it; keep the person at a natural scale. Photorealistic.
"""

# For the suggestion model, which looks at the scene when the user wrote no description and answers with four poses
# (POST /pose-suggestions). Each pose then fills {pose} above, so the rules here match that prompt's: only what is in
# the photo, no props, no other people, no other clothes. The server checks the answer: four different poses of at
# most 100 characters, the limit of a description, or it uses the default poses below.
suggestion_prompt = """
This photo shows a person at a place where a friend is about to photograph them. Suggest four poses for this person
that would make a good photo here.
- Each pose must work with only what is already in the photo. Lean on, sit on, or touch a wall, door, step, railing,
  bench, or other thing only if it is in the photo and within the person's reach. Never ask for a prop, another
  person, or other clothes.
- Make the four poses clearly different: for example a relaxed standing pose, a pose that uses something in this
  place, a pose in motion such as walking or turning, and a playful or expressive pose.
- Write each pose as one short instruction in English, at most 80 characters, the way a photographer directs
  someone: the body, the hands, where to look, and the expression. Do not describe the place, the clothes, or the
  camera, and do not mention the person's looks, age, or identity.
Answer with JSON only, in this form: {"poses": ["...", "...", "...", "..."]}
"""

# For the same model when the user wrote a description (POST /pose-suggestions with a description). One candidate
# follows the description as written; the three variations written here are the other three, because the image model
# gives four nearly identical images for one text. {description} stands for the description, which the prompt holds
# exactly once. The server checks the answer like the suggestions and repeats the description for any variation it
# cannot use. Tried on 2026-10-21.
variation_prompt = """
This photo shows a person at a place where a friend is about to photograph them. The person described the pose they
want, in Korean or English: "{description}". Four photos will be made: one of the description as written, and one of
each of three variations that you write now. Make the four photos clearly different, while each still does what the
description asks.
- Keep everything the description says: the action, where the person looks, the expression, and every body part,
  side, or thing it names. Never add anything that contradicts it.
- Change what the description leaves open, and change something different in each variation: the arms and hands, the
  legs and stance, the turn of the body, the tilt of the head, or the spot in this place.
- Use only what is already in the photo. Lean on, sit on, or touch a wall, door, step, railing, bench, or other thing
  only if it is in the photo and within the person's reach. Never ask for a prop, another person, or other clothes.
- If a variation cannot keep the description's meaning, write the description itself in English instead.
- Write each variation as one short instruction in English, at most 90 characters, the way a photographer directs
  someone. Do not describe the place, the clothes, or the camera, and do not mention the person's looks, age, or
  identity.
Answer with JSON only, in this form: {"poses": ["...", "...", "..."]}
"""

# For the tip model (POST /pose-tips): the scene photo, then the candidate the user chose, then how to hold the phone
# for it. The answer's fields come in the schema's order, so the model decides the shot and the pose before the
# height and the angle, and writes the sentence last; the rules for the height and the angle are photographers' rules
# of thumb, and the sentence says each in words, never in numbers, because a number is hard to follow while shooting.
# The server compares camera_now with camera_best for the height move and checks the sentence. Tried on 2026-10-25
# with 17 scenes (scripts/try_pose_tips.py).
tip_prompt = """
Photo 1 is the scene a photographer took from where they stand. Photo 2 is the photo they now want: the same person
in a new pose, made from photo 1 by an AI that may have framed the person closer or changed the camera height or
angle a little. Help the photographer hold the phone for photo 2. Only the phone: never tell the person how to pose,
because the app already shows the pose. Fill in, in this order:
- shot: how much of the person photo 2 shows.
- pose: the kind of pose in photo 2. "sitting" only when the person's hips rest on the ground, a step, a bench, or a
  ledge; a person standing with their back or side against something is "leaning".
- camera_now: how the photographer, an adult standing in front of the person, held the phone for photo 1: crouching,
  at their waist, chest, or eye level, or above their head. A clue: the horizon, or the height where level lines
  stop slanting, crosses a standing person at about the camera's height; looking down on the head and the ground
  means a high camera, looking up at the chin means a low one.
- camera_best and angle: how to hold the phone so this shot and pose look their best, from these rules:
  - full body of a person standing, walking, or leaning: waist, angle "up" (tilted up a little), so the legs look
    longer;
  - knees up or waist up of a person standing, walking, or leaning: chest, angle "level", so the body keeps its
    proportions;
  - chest up: eye, angle "down" (tilted down a little), so the face looks its best;
  - a person sitting or crouching, whatever the shot: crouching, so the phone is at their eye level, angle "level",
    so you do not look down on them.
  If photo 2 is clearly taken from below (looking up at the person) or from above (looking down on them), follow
  photo 2 instead and keep its look.
- framing: compare how much of the body each photo shows and how tall the person is against the photo's height.
  "closer" when photo 2 shows less of the body (for example the whole body in photo 1, only down to the knees or
  the waist in photo 2) or the person is clearly bigger; "back" when photo 2 shows clearly more; otherwise "keep".
- text: one sentence, at most twenty-five words, in plain words and in this order: how close to get, only when
  framing is "closer" or "back" ("zoom in or take a step closer", "step back a little"); where to hold the phone by
  the photographer's own posture ("crouch", "at your waist", "at your chest", "at your eye level"); the angle
  ("tilt it up a little", "tilt it down a little", or "keep it level"); then a dash and the one reason given in the
  rule above, in a few words. Say each thing once. Examples: "Zoom in or take a step closer, hold the phone at your
  waist and tilt it up a little - the legs look longer." "Crouch until the phone is at their eye level and keep it
  level - you don't look down on them." Never use numbers, units, or degrees, or empty words such as "perfectly",
  "ensures", "best composition", or "flattering perspective". Do not describe the person's looks.
Answer with JSON only.
"""

# The four poses used when the suggestion model fails or its answer is unusable, in this order. Apps from before
# Iteration 2 also ask for them by id (GET /pose-templates, POST /poses with templateId): they see the `label` and
# send the `id` back, so keep an `id` while such an app may still be installed. Only `pose` reaches the image model.
[[default_poses]]
id = "hands_on_hips"
label = "Hands on hips"
pose = "standing with both hands on the hips"

[[default_poses]]
id = "wave"
label = "Wave"
pose = "waving at the camera with one raised hand"

[[default_poses]]
id = "walking"
label = "Walking"
pose = "walking toward the camera in mid-stride"

[[default_poses]]
id = "arms_crossed"
label = "Arms crossed"
pose = "standing with the arms crossed over the chest"

# Selfie mode (FR-1.14): the scene photo is a selfie from the front camera, as the preview mirrored it, and the app
# sends `selfie` with POST /pose-suggestions and POST /poses. One hand holds the phone at arm's length, so a pose has
# only the other hand, the head, the face, and the shoulders to work with, and the shot stays a selfie: never full
# body, never the phone itself. Otherwise the same as the prompts above: the same person, clothes, place, and light, and
# nothing outside the original frame. Tried on 2026-10-29 with three selfies through the server: the prompts above
# turned each into a photo someone else took, with both hands free and the arm that held the phone gone, while these
# kept all twelve candidates selfies.
[selfie]
pose_prompt = """
Edit this photo. It is a selfie: the person holds a phone in one hand at arm's length and took this photo with its
front camera. Keep the same person (face, hair, clothing), the same place, and the same lighting. The user described
the pose they want, in Korean or English: "{pose}". Change the person's pose and facial expression to match it.

Make it the kind of selfie people love to post on social media: natural and effortless, never stiff, with a real,
easy expression and the head turned or tilted a little rather than square to the camera. Improve the shot only in
these ways, and only where it clearly makes a better selfie for this pose:
- hold the phone a little above the eyes and tilt it down slightly, the most flattering angle for a selfie, or at eye
  level if the pose reads better that way;
- frame the person a little more tightly, for example from the waist up to the chest up, if the pose reads better
  that way.
Everything the new shot shows must already be visible in the original photo: never zoom out, widen the view, or
reveal any part of the place outside the original frame. If the original framing already suits the pose, keep it.

Follow these rules even where the description says otherwise: one hand always holds the phone, so the pose uses only
the other hand, the face, the head, and the shoulders; the arm that holds the phone reaches toward the camera and out
of the frame, and the phone never appears; it stays a selfie taken at arm's length, never full body and never a photo
taken by someone else; never change the person's clothing, or the background, place, sky, or time of day; never add
an object, a prop, or another person that is not already in the photo; keep the person at a natural scale.
Photorealistic.
"""

# For the suggestion model with a selfie and no description. The same checks as suggestion_prompt; its poses fill
# {pose} in the selfie pose prompt.
suggestion_prompt = """
This photo is a selfie: the person holds a phone in one hand at arm's length and is about to take another selfie
here. Suggest four selfie poses for this person that would make a natural, stylish selfie of the kind people love to
post on social media.
- One hand holds the phone, so each pose uses only the other hand, the face, the head, and the shoulders. Never ask
  for both hands, a full-body or walking pose, a prop, another person, or other clothes.
- Make the four poses clearly different: for example a soft smile with the head tilted, a gesture with the free hand
  near the face (a V sign, the chin on the hand, or a finger heart), a candid look away from the camera, and a playful
  or expressive face.
- Write each pose as one short instruction in English, at most 80 characters, the way a friend describes a selfie
  pose: the free hand, the head, where to look, and the expression. Do not describe the place, the clothes, or the
  camera, and do not mention the person's looks, age, or identity.
Answer with JSON only, in this form: {"poses": ["...", "...", "...", "..."]}
"""

# For the same model with a selfie and a description: the description and three variations, as variation_prompt.
variation_prompt = """
This photo is a selfie: the person holds a phone in one hand at arm's length and is about to take another selfie
here. The person described the pose they want, in Korean or English: "{description}". Four selfies will be made: one
of the description as written, and one of each of three variations that you write now. Make the four selfies
clearly different, while each still does what the description asks.
- Keep everything the description says: the gesture, where the person looks, the expression, and every body part,
  side, or thing it names. Never add anything that contradicts it.
- Change what the description leaves open, and change something different in each variation: the free hand, the
  tilt or turn of the head, where the person looks, or the expression.
- One hand holds the phone, so each variation uses only the other hand, the face, the head, and the shoulders. Never
  ask for both hands, a full-body pose, a prop, another person, or other clothes.
- If a variation cannot keep the description's meaning, write the description itself in English instead.
- Write each variation as one short instruction in English, at most 90 characters, the way a friend describes a
  selfie pose. Do not describe the place, the clothes, or the camera, and do not mention the person's looks, age, or
  identity.
Answer with JSON only, in this form: {"poses": ["...", "...", "..."]}
"""

# The four selfie poses used when the suggestion model fails or its answer is unusable, in this order. Only for the
# current app, so they need no id.
default_poses = [
    "smiling softly with the head tilted a little to one side",
    "a V sign with the free hand next to the cheek",
    "resting the chin on the free hand and looking into the camera",
    "looking away from the camera with a relaxed half smile",
]
